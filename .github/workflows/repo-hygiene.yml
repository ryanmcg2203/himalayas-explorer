name: Repository hygiene

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/check_repo_hygiene.py
      - run: node tests/metrics.test.js
      - run: node --check dist/metrics.js
